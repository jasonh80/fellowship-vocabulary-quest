<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VocaBuilder for Fellowship Christian School</title>
  <desc id="desc">A navy, gold, and steel blue VocaBuilder app icon incorporating the Fellowship Christian School logo.</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="20" x2="476" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b4772"/>
      <stop offset=".56" stop-color="#012b49"/>
      <stop offset="1" stop-color="#071b35"/>
    </linearGradient>
    <linearGradient id="word" x1="132" y1="250" x2="380" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8d3"/>
      <stop offset="1" stop-color="#c1a01f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#5f8fb4" stroke-opacity=".55" stroke-width="4"/>
  <path d="M66 184H446" stroke="#c1a01f" stroke-width="3" stroke-linecap="round" opacity=".86"/>
  <g filter="url(#shadow)">
    <image href="fcs-logo.svg" x="73" y="62" width="366" height="96" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g fill="#5f8fb4" opacity=".88">
    <rect x="103" y="221" width="49" height="49" rx="12" transform="rotate(-7 103 221)"/>
    <rect x="183" y="212" width="49" height="49" rx="12" transform="rotate(5 183 212)"/>
    <rect x="263" y="221" width="49" height="49" rx="12" transform="rotate(-4 263 221)"/>
    <rect x="343" y="212" width="49" height="49" rx="12" transform="rotate(7 343 212)"/>
  </g>
  <text x="256" y="339" text-anchor="middle" fill="url(#word)" font-family="Open Sans, Arial, sans-serif" font-size="81" font-weight="800" letter-spacing="-5">VOCA</text>
  <text x="256" y="409" text-anchor="middle" fill="#fff" font-family="Open Sans, Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-3">BUILDER</text>
  <g transform="translate(177 446)">
    <rect width="32" height="9" rx="4.5" fill="#348338"/>
    <rect x="42" width="32" height="9" rx="4.5" fill="#e87722"/>
    <rect x="84" width="32" height="9" rx="4.5" fill="#893b67"/>
    <rect x="126" width="32" height="9" rx="4.5" fill="#c1a01f"/>
  </g>
</svg>
